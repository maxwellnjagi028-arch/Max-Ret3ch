{% extends "base.html" %}

{% block title %}Authentication Portal | MaxReT3ch AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-panel p-8 border-cyan-500/40 shadow-[0_0_35px_rgba(0,240,255,0.15)] relative">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-cyan-950 border border-cyan-400 mx-auto flex items-center justify-center font-black text-cyan-300 font-mono text-xl shadow-[0_0_15px_rgba(0,240,255,0.4)] mb-3">
                MR3
            </div>
            <h1 class="text-2xl font-extrabold text-white">System Access Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Authenticate into MaxReT3ch AI operations infrastructure</p>
        </div>

        <!-- 1-Click Quick Demo Account Switcher -->
        <div class="mb-6 p-3.5 rounded-lg bg-black/60 border border-slate-800 text-xs">
            <span class="text-[10px] font-mono font-bold text-cyan-400 uppercase tracking-wider block mb-2">⚡ 1-Click Role Login</span>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="quickFill('admin@maxret3ch.ai', 'Admin123!')" class="p-2 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 font-semibold text-[11px] transition-all text-center">
                    Admin
                </button>
                <button type="button" onclick="quickFill('sarah@maxret3ch.ai', 'Staff123!')" class="p-2 rounded bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold text-[11px] transition-all text-center">
                    Staff
                </button>
                <button type="button" onclick="quickFill('david@apexsystems.io', 'Client123!')" class="p-2 rounded bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-semibold text-[11px] transition-all text-center">
                    Client
                </button>
            </div>
        </div>

        <!-- Tabs: Sign In / Register -->
        <div class="flex border-b border-slate-800 mb-6 text-xs font-semibold">
            <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400">
                Sign In
            </button>
            <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-slate-400 border-b-2 border-transparent hover:text-white">
                Register New Account
            </button>
        </div>

        <!-- Login Form -->
        <form id="auth-login-form" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1">Username or Email</label>
                <input type="text" id="login-user" required placeholder="admin@maxret3ch.ai" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:border-cyan-400 outline-none">
            </div>

            <div>
                <label class="block text-slate-300 mb-1">Password</label>
                <input type="password" id="login-pass" required placeholder="••••••••••••" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:border-cyan-400 outline-none font-mono">
            </div>

            <button type="submit" class="w-full btn-electric py-2.5 text-xs font-bold mt-2">
                Sign In to Enterprise Cockpit
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="auth-register-form" class="hidden space-y-3 text-xs">
            <div>
                <label class="block text-slate-300 mb-1">Full Legal Name</label>
                <input type="text" id="reg-name" required placeholder="Dr. Evelyn Reed" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-cyan-400 outline-none">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Username</label>
                <input type="text" id="reg-username" required placeholder="evelyn.reed" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-cyan-400 outline-none">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Corporate Email</label>
                <input type="email" id="reg-email" required placeholder="evelyn@reedai.com" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-cyan-400 outline-none">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Company / Organization</label>
                <input type="text" id="reg-company" placeholder="Reed AI Corp" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-cyan-400 outline-none">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Password</label>
                <input type="password" id="reg-pass" required placeholder="••••••••••••" class="w-full bg-black/70 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-cyan-400 outline-none font-mono">
            </div>
            <button type="submit" class="w-full btn-electric py-2.5 text-xs font-bold mt-2">
                Create Account
            </button>
        </form>

    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function quickFill(user, pass) {
        switchAuthTab('login');
        document.getElementById('login-user').value = user;
        document.getElementById('login-pass').value = pass;
    }

    function switchAuthTab(tab) {
        const loginForm = document.getElementById('auth-login-form');
        const regForm = document.getElementById('auth-register-form');
        const tabLogin = document.getElementById('tab-login');
        const tabReg = document.getElementById('tab-register');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
            tabLogin.className = 'flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400';
            tabReg.className = 'flex-1 py-2 text-slate-400 border-b-2 border-transparent hover:text-white';
        } else {
            loginForm.classList.add('hidden');
            regForm.classList.remove('hidden');
            tabReg.className = 'flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400';
            tabLogin.className = 'flex-1 py-2 text-slate-400 border-b-2 border-transparent hover:text-white';
        }
    }

    document.getElementById('auth-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username_or_email = document.getElementById('login-user').value;
        const password = document.getElementById('login-pass').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username_or_email, password })
            });
            const data = await res.json();
            if (res.ok) {
                App.showToast("Signed in successfully!", "success");
                setTimeout(() => {
                    if (['admin', 'staff'].includes(data.user.role)) {
                        window.location.href = '/dashboard';
                    } else {
                        window.location.href = '/portal';
                    }
                }, 600);
            } else {
                App.showToast(data.detail || "Authentication failed", "error");
            }
        } catch (e) {
            App.showToast("Server connection error", "error");
        }
    });

    document.getElementById('auth-register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const full_name = document.getElementById('reg-name').value;
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const company = document.getElementById('reg-company').value;
        const password = document.getElementById('reg-pass').value;

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, username, email, company, password })
            });
            const data = await res.json();
            if (res.ok) {
                App.showToast("Registration successful!", "success");
                setTimeout(() => {
                    window.location.href = '/portal';
                }, 600);
            } else {
                App.showToast(data.detail || "Registration failed", "error");
            }
        } catch (e) {
            App.showToast("Server connection error", "error");
        }
    });
</script>
{% endblock %}
